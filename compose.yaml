services:
  open-easyx:
    image: ghcr.io/raccommode/open-easyx:latest
    pull_policy: always
    container_name: open-easyx
    restart: unless-stopped
    # Time to save running live recordings when the container stops (see EASYX_SHUTDOWN_GRACE_SECONDS).
    stop_grace_period: 90s
    ports:
      - "3210:3210"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      EASYX_MAX_CONCURRENT_DOWNLOADS_LIMIT: ${EASYX_MAX_CONCURRENT_DOWNLOADS_LIMIT:-8}
      STRIPCHAT_MERGE_GAP_MINUTES: ${STRIPCHAT_MERGE_GAP_MINUTES:-10}
      CAM4_MERGE_GAP_MINUTES: ${CAM4_MERGE_GAP_MINUTES:-10}
      BONGACAMS_MERGE_GAP_MINUTES: ${BONGACAMS_MERGE_GAP_MINUTES:-10}
      EASYX_DATA_DIR: /data
      EASYX_MEDIA_DIR: /media
      EASYX_EXTERNAL_PLUGINS_DIR: /plugins
      EASYX_SCAN_INTERVAL_MINUTES: ${EASYX_SCAN_INTERVAL_MINUTES:-60}
      EASYX_WHISPER_MODEL: ${EASYX_WHISPER_MODEL:-small}
    volumes:
      - ./data:/data
      - ./media:/media
      - ./plugins-external:/plugins:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    profiles: ["javlibrary"]
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
